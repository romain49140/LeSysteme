<style>
/* Concept : fenêtres holographiques bleues à coins cadrés, nuit profonde, une seule ambiance sombre. Navigation basse, une colonne. */
:root{
  --bg:#050914; --panel:#0a1730; --line:#1f4a8f;
  --blue:#4db8ff; --blue-d:#2a79e0; --glow:rgba(77,184,255,.28);
  --text:#e1eeff; --dim:#8aa0c4; --faint:#4b6490;
  --violet:#a47bff; --gold:#ffcb5c; --ok:#4de3ac; --warn:#ffb14d; --bad:#ff6178;
  --f-d:'Chakra Petch','Barlow',system-ui,sans-serif;
  --f-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-m:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 var(--f-b);color:var(--text);
  background:radial-gradient(900px 480px at 50% -6%,rgba(42,121,224,.2),transparent 66%),var(--bg);
  padding-block:calc(12px + env(safe-area-inset-top,0px)) 104px;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.shell{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
p{margin:0}
.lead{color:var(--dim);margin-bottom:12px}
.small{font-size:12.5px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 0 8px;background:linear-gradient(var(--bg) 72%,transparent)}
.hexb{--rk:var(--blue);width:44px;height:48px;flex:none;display:grid;place-items:center;background:var(--rk);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hexb>b{width:40px;height:44px;display:grid;place-items:center;background:var(--bg);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font:700 20px var(--f-d);color:var(--rk)}
.who{min-width:0;flex:1}
.who .nm{font:600 16px var(--f-d);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .tt{font-size:12px;color:var(--violet);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillrow{display:flex;gap:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);background:rgba(13,29,61,.7);font:500 13px var(--f-m);white-space:nowrap}
.pill svg{flex:none}

/* windows */
.win{position:relative;padding:16px 16px 18px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(14,32,66,.8),rgba(8,18,40,.88));
  box-shadow:inset 0 0 0 1px rgba(77,184,255,.07),0 0 30px -14px var(--blue)}
.win::before,.win::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--blue);pointer-events:none}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.wh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;font:600 12px var(--f-d);letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
.wh>span:first-child::before{content:"[ ";opacity:.65}.wh>span:first-child::after{content:" ]";opacity:.65}
.wh .dim{letter-spacing:.06em;font-weight:500;text-transform:none}
h3{margin:14px 0 8px;font:600 13px var(--f-d);letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
h3:first-child{margin-top:0}

/* controls */
.btn{font:600 12px var(--f-d);letter-spacing:.1em;text-transform:uppercase;color:var(--blue);background:rgba(77,184,255,.08);border:1px solid var(--blue-d);padding:9px 14px;min-height:40px;cursor:pointer;border-radius:2px;transition:background .15s,box-shadow .15s}
.btn:hover{background:rgba(77,184,255,.18);box-shadow:0 0 16px -4px var(--blue)}
.btn.pri{background:var(--blue-d);color:#fff;border-color:var(--blue)}
.btn.pri:hover{background:#3a8bf5}
.btn.sm{min-height:34px;padding:6px 10px;font-size:11px}
.btn.bad{color:var(--bad);border-color:#a8374a;background:rgba(255,97,120,.07)}
.btn[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.lab{font:500 11.5px var(--f-d);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.in{width:100%;min-width:0;min-height:42px;padding:8px 10px;background:rgba(3,8,20,.8);border:1px solid var(--line);border-radius:2px;font:500 16px var(--f-m);color:var(--text)}
.in[type=date]{-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;max-width:100%;min-width:0;overflow:hidden;font-size:15px;padding-right:6px}
.in[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0}
.in[type=date]::-webkit-calendar-picker-indicator{margin:0 0 0 4px;padding:0}
.sess li .lnk{display:block;margin-top:2px;text-align:left}
.in:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 2px rgba(77,184,255,.25)}
select.in{font-family:var(--f-b)}
.unit{position:relative}.unit .in{padding-right:40px}
.unit::after{content:attr(data-u);position:absolute;right:10px;bottom:11px;font:500 12px var(--f-m);color:var(--faint);pointer-events:none}
.seg{display:flex;gap:0;border:1px solid var(--line)}
.seg button{flex:1;min-width:0;min-height:42px;padding:6px 8px;background:transparent;border:0;border-right:1px solid var(--line);cursor:pointer;color:var(--dim);font:500 13px var(--f-b)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:rgba(77,184,255,.16);color:var(--blue);box-shadow:inset 0 -2px 0 var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border:1px solid var(--line);background:transparent;color:var(--dim);font:500 12.5px var(--f-b);cursor:pointer;border-radius:2px;min-height:34px}
.chip[aria-pressed=true]{color:var(--blue);border-color:var(--blue);background:rgba(77,184,255,.12)}
.tag{display:inline-block;padding:2px 8px;border:1px solid currentColor;font:600 11px var(--f-d);letter-spacing:.08em;text-transform:uppercase;border-radius:2px}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);background:transparent;cursor:pointer;min-width:0}
.opt b{font:600 13px var(--f-d);letter-spacing:.04em}.opt span{font-size:12.5px;color:var(--dim)}
.opt[aria-pressed=true]{border-color:var(--blue);background:rgba(77,184,255,.12);box-shadow:0 0 18px -8px var(--blue)}
.err{margin-top:10px;padding:9px 11px;border:1px solid #a8374a;background:rgba(255,97,120,.08);color:#ffb3bf;font-size:13.5px}
.note{margin-top:10px;padding:9px 11px;border:1px solid rgba(255,177,77,.4);background:rgba(255,177,77,.07);color:#ffd9a6;font-size:13.5px}
.info{margin-top:10px;padding:9px 11px;border:1px solid rgba(77,184,255,.3);background:rgba(77,184,255,.06);color:var(--dim);font-size:13.5px}
.empty{padding:18px 8px;text-align:center;color:var(--dim)}

/* bars */
.bar{height:8px;background:rgba(77,184,255,.1);border:1px solid rgba(77,184,255,.28);position:relative}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue-d),var(--blue));box-shadow:0 0 10px var(--glow);transition:width .4s}
.bar.done>i{background:linear-gradient(90deg,#1fa979,var(--ok))}
.bar.xp{height:10px}.bar.xp>i{background:linear-gradient(90deg,#6b4bd6,var(--violet))}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid rgba(77,184,255,.12)}
.kv:first-of-type{border-top:0}
.kv>span:first-child{color:var(--dim)}
.kv>span:last-child{font-family:var(--f-m);text-align:right}
.big{font:700 34px/1 var(--f-d);letter-spacing:.02em}

/* status */
.idrow{display:flex;align-items:center;gap:14px}
.idrow .hexb{width:62px;height:68px}.idrow .hexb>b{width:57px;height:63px;font-size:30px}
.lvbig{margin-left:auto;text-align:right}.lvbig small{display:block;font:500 11px var(--f-d);letter-spacing:.2em;color:var(--dim)}
.lvbig b{font:700 40px/1 var(--f-d);color:var(--blue);text-shadow:0 0 18px var(--glow)}
.shop{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(77,184,255,.12)}
.shop:first-of-type{border-top:0}.shop>div{flex:1;min-width:0}

/* quests */
.q{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid rgba(77,184,255,.16)}
.q:first-of-type{border-top:0;padding-top:4px}
.qi{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);color:var(--blue);background:rgba(77,184,255,.06)}
.q.done .qi{color:var(--ok);border-color:rgba(77,228,172,.5)}
.qn{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.qn b{font:600 15px var(--f-d);letter-spacing:.04em}
.qv{font:500 13px var(--f-m);color:var(--dim)}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.qc .in{width:112px;min-height:38px;padding:6px 8px}
.rw{font:500 12px var(--f-m);color:var(--violet)}
.claim{animation:none}
.claim.ready{background:var(--ok);color:#03241a;border-color:var(--ok);box-shadow:0 0 18px -4px var(--ok)}
@media (prefers-reduced-motion:no-preference){.claim.ready{animation:pulse 1.8s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 26px 2px rgba(77,228,172,.55)}}

/* charts */
.ch{display:block;width:100%;height:auto}
.ch .gr{stroke:rgba(77,184,255,.14);stroke-width:1}
.ch .ax{fill:var(--faint);font:400 10px var(--f-m)}
.ch .ln{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(77,184,255,.55))}

<script>
(function(){
'use strict';

/* ---------- utilitaires ---------- */
const KEY='sysq.v1';

  stretch:'<circle cx="12" cy="5" r="2"/><path d="M12 8v6M5 9l7 2 7-2M9 21l3-7 3 7"/>',
  meal:'<circle cx="12" cy="12" r="7.500"/><circle cx="12" cy="12" r="3"/>',
  cal:'<rect x="4" y="5" width="16" height="15"/><path d="M4 10h16M9 3v4M15 3v4"/>'
};
const ic=(n,s)=>`<svg class="ic" width="${s||22}" height="${s||22}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

const ROMAN=['','I','II','III','IV','V','VI','VII','VIII','IX','X'];
function emblem(n,size){
  const w=size||48,h=Math.round(w*1.1);
  if(!n) return `<svg class="emb" width="${w}" height="${h}" viewBox="0 0 60 66" role="img" aria-label="Aucun prestige" style="color:var(--faint)"><path d="M30 2l26 14v34L30 64 4 50V16z" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/></svg>`;
  const col=n>=MAXP?'var(--violet)':'var(--gold)',fs=n>=8?15:n>=4?18:22;
  return `<svg class="emb" width="${w}" height="${h}" viewBox="0 0 60 66" role="img" aria-label="Prestige ${ROMAN[n]}" style="color:${col}"><path d="M30 2l26 14v34L30 64 4 50V16z" fill="var(--bg)" stroke="currentColor" stroke-width="2.5"/><path d="M30 9l19.5 10.5v25.5L30 57.5 10.5 45V19.5z" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.2"/><text x="30" y="${n>=8?39:40}" text-anchor="middle" font-family="Chakra Petch,system-ui,sans-serif" font-size="${fs}" font-weight="700" fill="currentColor">${ROMAN[n]}</text></svg>`;
}

/* ---------- stockage ---------- */
let memStore=null;
const lsGet=()=>{try{const v=localStorage.getItem(KEY);return v==null?memStore:v}catch(e){return memStore}};
const lsSet=v=>{memStore=v;try{localStorage.setItem(KEY,v)}catch(e){}};

let S=null;
const ui={impText:'',impPrev:null,impErr:'',pType:'lift',rMetric:'speed',rEdit:null,rAll:false,tab:'status',planTab:'meal',metric:'weight',exSel:'',lbMode:'month',range:'all',mOpen:false,pEdit:null,pAll:false,prefill:'',shift:0,wz:null,day:'',editDay:null,open:{}};

const blankDay=()=>({steps:0,work:0,stretch:0,claimed:{},allDone:false});
function newState(profile,measure){
  return {v:1,t:Date.now(),created:today(),profile,xp:0,lifeXp:0,prestige:0,days:{},measures:[measure],perf:[],runs:[],duelClaims:{},progMode:'auto',recapSeen:'',custom:{},progStart:weekStart(today()),shopDone:{},shopWeek:'',mhist:{}};
}
function migrate(s){
  if(!s||typeof s!=='object'||!s.profile||!Array.isArray(s.measures)||!s.measures.length) return null;

  o.custom=cleanCustom(s.custom);

    if(!['full','ul','ppl'].includes(pr.style)) delete pr.style;
    if(!['gym','dumbbell','bodyweight'].includes(pr.equip)) pr.equip='gym';
    if(Array.isArray(pr.gear)) pr.gear=gearList(pr.gear); else delete pr.gear;
  }
  o.progStart=/^\d{4}-\d{2}-\d{2}$/.test(s.progStart||'')?s.progStart:weekStart(o.created||today());
  o.shopDone=(s.shopDone&&typeof s.shopDone==='object')?s.shopDone:{}; o.shopWeek=String(s.shopWeek||'');
  o.mhist=(s.mhist&&typeof s.mhist==='object')?s.mhist:{};
  o.swaps={};if(s.swaps&&typeof s.swaps==='object') for(const k of SWAPKEYS) if(Number.isInteger(s.swaps[k])&&s.swaps[k]>0) o.swaps[k]=s.swaps[k]%1000;
  o.group=cleanGroup(s.group);
  o.duel=cleanDuel(s.duel);o.duelClaims=cleanClaims(s.duelClaims);
  o.people=clamp(Math.floor(Number(s.people)||1),1,6);
  o.prestige=clamp(Math.floor(Number(s.prestige)||0),0,MAXP);
  o.xp=clamp(Math.floor(Number(s.xp)||0),0,CAP);
  o.lifeXp=Number.isFinite(s.lifeXp)?Math.max(0,s.lifeXp):o.xp+o.prestige*CAP;
  delete o.medals; delete o.arch; delete o.timer;
  delete o.titles; delete o.gold; delete o.title;
  o.measures.sort((a,b)=>a.d<b.d?-1:1);
  return o;
}
function save(){
  if(!S) return;
  S.t=Date.now();
  pruneIfBig();
  lsSet(JSON.stringify(S));
  schedulePush();
}
function pruneIfBig(){
  let guard=0;
  while(JSON.stringify(S).length>230000&&guard++<200){
    const ks=Object.keys(S.days).sort(); if(ks.length<=60) break;
    const k=ks[0],d=S.days[k];
    if(guard===1) S.mhist=monthMap();
    delete S.days[k];
  }
}
const lastMeasure=()=>S.measures[S.measures.length-1];
function addMeasure(m){
  const i=S.measures.findIndex(x=>x.d===m.d);
  if(i>=0) S.measures[i]=Object.assign({},S.measures[i],m); else S.measures.push(m);
  S.measures.sort((a,b)=>a.d<b.d?-1:1);
}
const dayView=k=>S.days[k]||blankDay();
function touchDay(k){
  const d=S.days[k]=Object.assign(blankDay(),S.days[k]||{});
  if(!d.claimed) d.claimed={};
  return d;
}

/* ---------- règles du jeu ---------- */
const QUESTS=[
  {id:'steps',n:'Pas quotidiens',ic:'steps',xp:60,t:10000},
  {id:'work',n:'Séance de sport',ic:'dumb',xp:100,t:60},
  {id:'stretch',n:'Étirements et mobilité',ic:'stretch',xp:30,t:10}
];
const ALLQ=QUESTS;
const isRest=k=>!slotList()[dow(k)];
const questsOf=k=>isRest(k)?QUESTS.filter(q=>q.id==='steps'):QUESTS;
const targetOf=id=>(ALLQ.find(q=>q.id===id)||{t:1}).t;
function progressOf(id,d){
  if(id==='steps') return d.steps||0;
  if(id==='work') return d.work||0;
  return d.stretch||0;
}
const claimedOf=(id,d)=>d.claimed&&d.claimed[id];

const MAXLV=55,MAXP=10;
const need=L=>80+8*(L-1);
const CAP=(()=>{let t=0;for(let L=1;L<MAXLV;L++)t+=need(L);return t})();
function levelInfo(xp){
  let L=1,rem=clamp(Math.floor(Number(xp)||0),0,CAP);

  return {L,into:rem,need:need(L),pct:rem/need(L),max:false};

function addXp(n){S.lifeXp=(S.lifeXp||0)+n;S.xp=Math.min(CAP,S.xp+n)}
function rankOf(L){
  if(L>=50) return {l:'S',c:'#ffcb5c'};
  if(L>=40) return {l:'A',c:'#ff7ad9'};
  if(L>=30) return {l:'B',c:'#a47bff'};
  if(L>=20) return {l:'C',c:'#4db8ff'};
  if(L>=10) return {l:'D',c:'#4de3ac'};
  return {l:'E',c:'#8aa0c4'};
}
const lvl=()=>levelInfo(S.xp).L;

function streakBefore(k){
  let n=0,c=addDays(k,-1);

  return n;

const streakNow=()=>{const k=today();return streakBefore(k)+(S.days[k]&&S.days[k].allDone?1:0)};
const multFor=k=>1+Math.min(0.30,0.02*streakBefore(k));
function goalTarget(){const p=S.profile;return (p.goal==='lose'||p.goal==='muscle')&&p.targetWeight?p.targetWeight:null}
const TITLES=['Initié','Marcheur','Vétéran','Forgeron','Infatigable','Colosse','Champion','Titan','Légende','Monarque'];
const titleName=()=>S.prestige>0?TITLES[Math.min(S.prestige,MAXP)-1]:'Éveillé';

function reconcile(){
  if(!S) return;
  const t=today();let ch=false;
  for(const k of Object.keys(S.days).sort()){
    const d=S.days[k]; if(!d) continue;
    if('water' in d||'lastDrink' in d||'sleep' in d){delete d.water;delete d.lastDrink;delete d.sleep;ch=true}

    if(d.claimed) for(const v of Object.values(d.claimed)) if(v&&'g' in v){delete v.g;ch=true}
    const all=!!d.claimed&&questsOf(k).every(q=>d.claimed[q.id]);

    else if(all&&!d.allDone){d.allDone=true;ch=true}

function claim(id){
  const k=today(),d=touchDay(k),q=ALLQ.find(x=>x.id===id);
  if(!q||claimedOf(id,d)) return;
  if(!questsOf(k).some(x=>x.id===id)){toast('Jour de repos : seuls les pas comptent aujourd’hui.');return}
  if(progressOf(id,d)<targetOf(id)){toast('Objectif pas encore atteint.');return}
  const m=multFor(k),before=lvl(),rb=rankOf(before).l;
  const xp=Math.round(q.xp*m);
  d.claimed[id]={xp}; addXp(xp);
  if(questsOf(k).every(x=>d.claimed[x.id])&&!d.allDone) d.allDone=true;
  const after=lvl(),ra=rankOf(after).l;
  save(); syncPlayer();
  showReward({q,xp,m,up:after>before?{from:before,to:after,rank:ra!==rb?ra:null}:null,maxed:after===MAXLV,streak:streakNow()});
  render();
}

function nutrition(){
  const p=S.profile,m=lastMeasure(),w=m.weight,h=p.height;
  const bmr=10*w+6.25*h-5*p.age+(p.sex==='m'?5:-161);
  const pal={2:1.4,3:1.45,4:1.55,5:1.65,6:1.7}[p.days]||1.5;
  const tdee=bmr*pal,b=bmi(w,h),notes=[];
  let mode=p.goal;
  if(mode==='lose'&&(p.age<18||b<20)){
    mode='maintain';
    notes.push(p.age<18?'Tu as moins de 18 ans : le plan vise le maintien et la progression, sans déficit calorique.':'Ton IMC est déjà bas : le plan vise le maintien, sans déficit calorique.');
  }
  let kcal;
  if(mode==='lose'){kcal=Math.max(tdee-Math.min(500,tdee*0.2),p.sex==='m'?1500:1200,bmr)}
  else if(mode==='muscle') kcal=tdee+300;
  else if(mode==='endurance') kcal=tdee+150;
  else kcal=tdee;
  kcal=Math.round(kcal/10)*10;
  const rw=b>30?24.9*Math.pow(h/100,2):w;
  const pk={lose:2.0,muscle:1.8,endurance:1.5,maintain:1.5}[mode];
  const prot=Math.round(pk*rw/5)*5;
  const fat=Math.round(Math.max(0.9*rw,kcal*0.22/9)/5)*5;
  const carb=Math.max(100,Math.round((kcal-prot*4-fat*9)/4/5)*5);
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,fat,carb,mode,notes,bmi:b};
}

function tierOf(){const b=S.profile.budget;return b<6?0:b<10?1:2}
function compose(t,cfg){
  const items=[],acc={p:0,c:0,f:0,k:0,cost:0};
  const put=(food,g,key)=>{
    if(!(g>0)) return;
    items.push({food,g,key:key||''});
    acc.p+=food.p*g/100;acc.c+=food.c*g/100;acc.f+=food.f*g/100;acc.k+=food.k*g/100;acc.cost+=food.pr*g/1000;
  };
  if(cfg.veg) put(cfg.veg,cfg.vegG);
  if(cfg.fruit) put(cfg.fruit,cfg.fruitG,cfg.kf);
  const P=cfg.prot,share=P.legume?0.7:0.85;
  let gP=Math.max(0,(t.p-acc.p))*share/(P.p/100);
  gP=clamp(gP,40,P.max||320);
  gP=P.unit?Math.max(1,Math.round(gP/P.unit))*P.unit:r5(gP);
  put(P,gP,cfg.kp);
  if(cfg.carb){
    let gC=(t.c-acc.c)/(cfg.carb.c/100);
    gC=r5(clamp(gC,0,cfg.carb.max||(cfg.carb.c<30?450:260)));
    if(gC>=20) put(cfg.carb,gC,cfg.kc);
  }
  if(cfg.fat){
    let gF=(t.f-acc.f)/(cfg.fat.f/100);
    gF=r5(clamp(gF,0,cfg.fatMax||25));
    if(gF>=5) put(cfg.fat,gF);
  }
  return {items,p:acc.p,c:acc.c,f:acc.f,k:acc.k,cost:acc.cost};
}
function buildMeals(shift){

  const sw=S.swaps||{},ix=(arr,i,key)=>(sh+i+(sw[key]||0))%arr.length,pick=(arr,i,key)=>FOODS[arr[ix(arr,i,key)]];

              :[['chicken','eggs','tuna'],['chicken','beef','tuna','eggs'],['chicken','beef','salmon','tuna']][tier];

  const lI=ix(lp,0,'l_p');let dI=ix(lp,1,'d_p');if(dI===lI&&lp.length>1) dI=(dI+1)%lp.length;
  const lC=ix(carbs,0,'l_c');let dC=ix(carbs,1,'d_c');if(dC===lC&&carbs.length>1) dC=(dC+1)%carbs.length;
  const defs=[
    {n:'Petit-déjeuner',s:.25,cfg:{prot:pick(bp,0,'b_p'),carb:pick(bc,0,'b_c'),fruit:pick(fruit,0,'b_f'),fruitG:120,fat:fatB,fatMax:30,kp:'b_p',kc:'b_c',kf:'b_f'}},
    {n:'Déjeuner',s:.32,cfg:{prot:FOODS[lp[lI]],carb:FOODS[carbs[lC]],veg:FOODS.veg,vegG:200,fat:FOODS.oil,fatMax:25,kp:'l_p',kc:'l_c'}},
    {n:'Collation',s:.13,cfg:{prot:pick(snp,1,'s_p'),carb:null,fruit:pick(fruit,1,'s_f'),fruitG:120,fat:fatB,fatMax:25,kp:'s_p',kf:'s_f'}},
    {n:'Dîner',s:.30,cfg:{prot:FOODS[lp[dI]],carb:FOODS[carbs[dC]],veg:FOODS.veg,vegG:250,fat:FOODS.oil,fatMax:25,kp:'d_p',kc:'d_c'}}
  ];
  const meals=defs.map(d=>Object.assign({n:d.n},compose(tg(d.s),d.cfg)));
  const tot=meals.reduce((a,m)=>({k:a.k+m.k,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f,cost:a.cost+m.cost}),{k:0,p:0,c:0,f:0,cost:0});
  return {N,meals,tot,tier};
}

function bodyFat(m,p){
  const w=m&&m.weight,h=p.height,wa=m&&m.waist;
  if(!(w>0&&h>0&&wa>0)) return null;
  const male=p.sex==='m',b=w/Math.pow(h/100,2);
  const dz=1.20*b+0.23*p.age-10.8*(male?1:0)-5.4;
  const rfm=64-20*(h/wa)+(male?0:12);
  const wl=w*2.20462,wi=wa/2.54;
  const ym=((male?-98.42:-76.76)+4.15*wi-0.082*wl)/wl*100;
  const parts=[{n:'IMC, âge et sexe (Deurenberg)',v:dz},{n:'Taille et hauteur (RFM)',v:rfm},{n:'Taille et poids (YMCA)',v:ym}].map(x=>({n:x.n,v:clamp(x.v,3,60)}));
  const v=parts.map(x=>x.v).sort((a,b)=>a-b),est=v[1],fat=w*est/100;
  return {est,lo:v[0],hi:v[2],parts,fatKg:fat,leanKg:w-fat};
}

function suggestFor(it,cw){
  if(it.k!=='main'&&it.k!=='acc') return '';
  const e=lastPerf(it.n); if(!e) return '';
  const x=parseRx(it.r)||schemeFor(it,cw);
  if(e.f==='pain') return 'Dernière : '+(e.kg>0?fmt(e.kg,1)+' kg × '+e.reps:e.reps+' répétitions')+'. Douleur signalée : allège la charge et soigne l’exécution.';
  if(e.kg>0){
    if(cw===3&&!it.r) return 'Dernière : '+fmt(e.kg,1)+' kg × '+e.reps+'. Cette semaine : environ '+fmt(Math.round(e.kg*0.9*2)/2,1)+' kg.';
    if(e.reps>=x.hi&&e.f==='hard') return 'Dernière : '+fmt(e.kg,1)+' kg × '+e.reps+' (dur). Garde la même charge cette fois.';
    if(e.reps>=x.hi){const up=LOWER.test(norm(it.n))?5:2.5;return 'Dernière : '+fmt(e.kg,1)+' kg × '+e.reps+'. Essaie '+fmt(e.kg+up,1)+' kg × '+x.lo+'.'}
    return 'Dernière : '+fmt(e.kg,1)+' kg × '+e.reps+'. Vise '+(e.reps+1)+' répétitions.';
  }
  return 'Dernière : '+e.reps+' répétitions. '+(e.reps>=x.hi?'Passe à une variante plus difficile.':'Vise '+(e.reps+1)+'.');
}
function buildSession(slot,occ,cw,block){
  const p=S.profile,goal=p.goal;
  if(slot==='own') return {slot,t:'Séance perso',mins:45,items:[],tip:'Séance personnalisée : tes exercices, tes séries, tes répétitions.'};
  if(slot==='cardio'){
    const main=['Allure régulière','Allure régulière avec 4 × 1 min plus rapides','Allure régulière avec 6 × 1 min plus rapides','Allure facile'][cw];
    return {slot,t:'Cardio endurance',mins:60,items:[{n:'Échauffement',r:'10 min'},{n:main+(gearHas('velo')?' (vélo d’appartement, rameur ou tapis)':' (marche rapide, jogging léger ou vélo)'),r:'40 min'},{n:'Retour au calme et étirements',r:'10 min'}],tip:'Garde une allure où tu peux parler en phrases courtes.'};
  }
  if(slot==='intervals'){
    const reps=[6,8,10,6][cw],fast=reps*2.5,rest=60-15-fast-10;
    return {slot,t:'Fractionné',mins:60,items:[{n:'Échauffement progressif',r:'15 min'},{n:reps+' × (1 min rapide + 1 min 30 lent)'+(gearHas('corde')?' : course, vélo ou corde à sauter':''),r:fast+' min'},{n:'Retour au calme',r:'10 min'},{n:'Mobilité et étirements',r:rest+' min'}],tip:'Les phases rapides demandent environ 8 sur 10 d’effort : tu ne peux plus parler, mais tu restes maîtrisé.'};
  }
  if(slot==='long'){
    const main=[50,55,60,45][cw];
    return {slot,t:'Sortie longue',mins:main+20,items:[{n:'Échauffement',r:'10 min'},{n:'Allure régulière',r:main+' min'},{n:'Retour au calme',r:'10 min'}],tip:'Allure conversationnelle : tu peux parler sans être essoufflé. La durée augmente chaque semaine, puis redescend en semaine d’allègement.'};
  }
  const pat=PAT[slot],lib=libFor(p),items=[{n:'Échauffement articulaire et séries légères',r:'8 min'}];
  pat.g.forEach(([g,cnt])=>{
    const arr=lib[g];
    for(let i=0;i<cnt;i++){
      const e=arr[(occ*2+i+block*2)%arr.length];
      items.push({n:e.n,k:g==='core'?'core':(i===0?'main':'acc'),t:!!e.t});
    }
  });
  const base=goal==='lose'?'Termine par 10 min de cardio modéré. Repos entre séries : 45–60 s.':'Repos entre séries : 60–90 s. Garde 1 à 2 répétitions en réserve.';
  const tip=cw===3?'Semaine d’allègement : garde 3 répétitions en réserve et allège les charges d’environ 10 %. '+base:base;
  return {slot,t:pat.t,mins:60,items,tip};
}
function cleanCustom(c){
  const out={};if(!c||typeof c!=='object') return out;
  for(const d of Object.keys(c)){
    if(!/^[0-6]$/.test(d)) continue;
    const x=c[d]; if(!x||typeof x!=='object'||!SLOTS.some(q=>q[0]===x.slot)) continue;
    const o={slot:x.slot};
    if(x.slot==='own'&&typeof x.t==='string'&&x.t.trim()) o.t=x.t.trim().slice(0,30);
    if(Array.isArray(x.items)&&x.slot!=='rest'){
      o.items=x.items.slice(0,14).map(it=>{
        const r={n:String((it&&it.n)||'').slice(0,40)};
        if(it&&it.r) r.r=String(it.r).slice(0,24);
        if(it&&['main','acc','core'].includes(it.k)) r.k=it.k;
        if(it&&it.t) r.t=true;
        return r;
      }).filter(it=>it.n.trim());
    }
    out[d]=o;
  }
  return out;
}
function planSlots(p){
  const dN=DAYPOS[p.days]?p.days:3,f=prefFocus(p);
  if(!f) return (SPLIT[p.goal]||SPLIT.maintain)[dN]||SPLIT.maintain[3];
  const st=['full','ul','ppl'].includes(p.style)?p.style:'auto';
  const lift=n=>{
    if(n<=1) return ['full'];
    if(st==='full') return Array(n).fill('full');
    if(st==='ul') return ['upper','lower','upper','lower','upper','lower'].slice(0,n);
    if(st==='ppl') return n===2?['upper','lower']:n===3?['push','pull','legs']:n===4?['push','pull','legs','upper']:n===5?['push','pull','legs','upper','lower']:['push','pull','legs','push','pull','legs'];
    if(f==='both') return ({2:['upper','lower'],3:['upper','lower','full']})[n]||['full'];
    return SPLIT.muscle[n]||SPLIT.muscle[3];
  };
  const run=n=>({1:['cardio'],2:['long','intervals'],3:['cardio','intervals','long'],4:['cardio','intervals','cardio','long'],5:['cardio','intervals','cardio','intervals','long'],6:['cardio','intervals','cardio','intervals','cardio','long']})[n]||['cardio'];
  if(f==='lift') return lift(dN);
  if(f==='run') return run(dN);
  const nl=Math.ceil(dN/2),L=lift(nl),R=run(dN-nl),out=[];
  for(let i=0;i<Math.max(L.length,R.length);i++){if(L[i]) out.push(L[i]);if(R[i]) out.push(R[i])}
  return out;
}
function baseSlots(){
  if(S.progMode==='own') return {};
  const p=S.profile,slots=planSlots(p),pos=DAYPOS[p.days]||DAYPOS[3],m={};
  slots.forEach((q,i)=>{m[pos[i]]=q});
  return m;
}
function slotList(){
  const m=baseSlots();
  for(let d=0;d<7;d++){const c=S.custom&&S.custom[d];if(c&&c.slot){if(c.slot==='rest') delete m[d]; else m[d]=c.slot}}
  return m;
}
const curSlot=d=>slotList()[d]||'rest';
function weekPlan(){
  const m=slotList(),occ={},out={},cw=cycleWeek(),block=Math.floor(progWeek()/4);
  for(let d=0;d<7;d++){
    const q=m[d]; if(!q) continue;
    occ[q]=occ[q]||0;
    const sess=buildSession(q,occ[q],cw,block);occ[q]++;
    const c=S.custom&&S.custom[d];
    if(c&&c.items&&c.items.length) sess.items=c.items.map(x=>Object.assign({},x));
    if(q==='own'){if(c&&c.t) sess.t=c.t;sess.mins=clamp(sess.items.length*8+8,20,150)}
    out[d]=sess;
  }
  return out;
}
function todaySession(){return S?weekPlan()[dow(today())]||null:null}
function ensureCustom(d){
  let c=S.custom[d];
  if(c&&c.items) return c;
  const cur=curSlot(d);
  c=c||{slot:cur};
  if(c.slot!=='rest'){const sess=weekPlan()[d];c.items=sess?sess.items.map(x=>Object.assign({},x)):[]}
  S.custom[d]=c;
  return c;
}

/* ---------- graphiques ---------- */
function niceFmt(v,dec){return fmt(v,dec)}
function lineChart(pts,o){
  if(!pts.length) return '<p class="empty">Pas encore de données pour cette courbe.</p>';
  const W=360,H=190,L=44,R=16,T=18,B=26,dec=o.dec==null?1:o.dec;
  let vals=pts.map(p=>p.v); if(o.goal!=null) vals.push(o.goal); if(o.trend) o.trend.forEach(q=>vals.push(q.v));
  let lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  const ms=o.minSpan||1;
  if(hi-lo<ms){const c=(hi+lo)/2;lo=c-ms/2;hi=c+ms/2}
  const pd=(hi-lo)*.12;lo-=pd;hi+=pd;
  const t0=parseKey(pts[0].d).getTime(),t1=parseKey(pts[pts.length-1].d).getTime();
  const X=d=>(pts.length===1||t1===t0)?L+(W-L-R)/2:L+(parseKey(d).getTime()-t0)/(t1-t0)*(W-L-R);
  const Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Courbe')} : ${pts.length} mesure${pts.length>1?'s':''}, dernière valeur ${niceFmt(pts[pts.length-1].v,dec)} ${esc(o.unit||'')}">`;
  if(o.band){
    const a=Math.max(o.band[0],lo),b=Math.min(o.band[1],hi);
    if(b>a) s+=`<rect class="bd" x="${L}" y="${Y(b)}" width="${W-L-R}" height="${Y(a)-Y(b)}"/>`;
  }
  for(let i=0;i<4;i++){
    const v=lo+(hi-lo)*i/3,y=Y(v);
    s+=`<line class="gr" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${y+3}" text-anchor="end">${niceFmt(v,dec)}</text>`;
  }
  if(o.goal!=null){const y=Y(o.goal);s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="gt" x="${W-R}" y="${y-4}" text-anchor="end">objectif ${niceFmt(o.goal,dec)}</text>`}
  if(pts.length>1) s+=`<path class="ln" d="${pts.map((p,i)=>(i?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ')}"/>`;
  if(o.trend&&o.trend.length>1) s+=`<path class="tr" d="${o.trend.map((p,i)=>(i?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ')}"/>`;
  pts.forEach((p,i)=>{
    const x=X(p.d),y=Y(p.v);
    if(i===pts.length-1) s+=`<circle class="halo" cx="${x}" cy="${y}" r="9"/><circle class="pl" cx="${x}" cy="${y}" r="4.5"/>`;
    else s+=`<circle class="pt" cx="${x}" cy="${y}" r="2.8"/>`;
  });
  const lp=pts[pts.length-1],lx=X(lp.d),ly=Y(lp.v);
  s+=`<text class="vl" x="${lx>W-70?lx-10:lx}" y="${ly-12}" text-anchor="${lx>W-70?'end':'middle'}">${niceFmt(lp.v,dec)}</text>`;
  if(pts.length>1){
    s+=`<text class="ax" x="${L}" y="${H-8}">${fmtShort(pts[0].d)}</text><text class="ax" x="${W-R}" y="${H-8}" text-anchor="end">${fmtShort(lp.d)}</text>`;
  } else s+=`<text class="ax" x="${(W+L-R)/2}" y="${H-8}" text-anchor="middle">${fmtShort(lp.d)}</text>`;
  return s+'</svg>';
}

function perfInsights(dw,multi){
  if(!S.perf.length&&!S.runs.length) return '<p class="small dim" style="margin:14px 0 0">Note tes performances dans l’onglet Perfs : elles alimenteront ici ta force, tes records et ton volume d’entraînement.</p>';
  const p=S.profile,t=today(),rows=[],notes=[];
  // force : évolution du 1RM estimé (début -> dernière séance) sur les exercices suivis assez longtemps
  const by={};
  S.perf.filter(e=>e.kg>0).forEach(e=>{const k=e.ex.toLowerCase(),v=perfVal(e);by[k]=by[k]||{};if(!by[k][e.d]||v>by[k][e.d]) by[k][e.d]=v});
  const ch=[];
  for(const k of Object.keys(by)){const ds=Object.keys(by[k]).sort();if(ds.length<2||daysBetween(ds[0],ds[ds.length-1])<14) continue;const a0=by[k][ds[0]],b0=by[k][ds[ds.length-1]];if(a0>0) ch.push((b0-a0)/a0*100)}
  const force=ch.length?ch.reduce((x,y)=>x+y,0)/ch.length:null;
  if(force!=null) rows.push(['Force',sgn(force,0)+' % · '+ch.length+' exercice'+(ch.length>1?'s':'')]);
  // course
  const km=(a,b)=>S.runs.filter(r=>r.d>=a&&r.d<=b).reduce((x,r)=>x+r.km,0),k30=km(addDays(t,-29),t),kp=km(addDays(t,-59),addDays(t,-30));
  if(k30>0||kp>0) rows.push(['Course',kmTxt(k30)+' km sur 30 j'+(kp>0?' ('+(k30>=kp?'+':'−')+kmTxt(Math.abs(k30-kp))+' km)':'')]);
  // records battus (30 j) et volume soulevé (7 j)
  let rec=0;const d30=addDays(t,-29);
  for(const k of Object.keys(by)){let mx=0;Object.keys(by[k]).sort().forEach(d=>{if(mx>0&&by[k][d]>mx&&d>=d30) rec++;if(by[k][d]>mx) mx=by[k][d]})}
  if(rec>0) rows.push(['Records battus','+'+rec+' en 30 j']);
  const vol=(a,b)=>Math.round(S.perf.filter(e=>e.d>=a&&e.d<=b).reduce((x,e)=>x+e.kg*e.reps,0)),v7=vol(addDays(t,-6),t),v14=vol(addDays(t,-13),addDays(t,-7));
  if(v7>0) rows.push(['Volume soulevé (7 j)',v7.toLocaleString('fr-FR')+' kg'+(v14>0?' ('+sgn((v7-v14)/v14*100,0,'%')+')':'')]);
  // régularité
  const first=[...S.perf.map(e=>e.d),...S.runs.map(r=>r.d)].sort()[0];
  const days=new Set([...S.perf.map(e=>e.d),...S.runs.map(r=>r.d)].filter(d=>d>=addDays(t,-27)&&d<=t));
  const enough=first&&daysBetween(first,t)>=14,perW=days.size/4;
  if(days.size) rows.push(['Séances / semaine',fmt(perW,1).replace(',0','')+' (plan : '+p.days+')']);
  // interprétation
  const g=p.goal;
  if(multi&&force!=null){
    if(g==='muscle'&&dw>0.3) notes.push(force>=0?['ok','Ton poids monte et ta force aussi : c’est le signe d’une prise de muscle.']:force<-2?['warn','Ton poids monte mais ta force baisse : ça ressemble plus à du gras. Vérifie ton sommeil et la progression de tes charges.']:null);
    if(g==='lose'&&dw<-0.3) notes.push(force>=-3?['ok','Tu perds du poids en gardant ta force : tu conserves ton muscle.']:force<-8?['warn','Ta force baisse avec ton poids : ralentis la perte et mange assez de protéines.']:null);
  }
  if(enough&&days.size&&perW<p.days*0.7) notes.push(['dim','Tu t’entraînes moins que prévu : baisse le nombre de séances du plan ou fixe-toi des créneaux.']);
  const pain=[...new Set(S.perf.filter(e=>e.f==='pain'&&e.d>=addDays(t,-14)).map(e=>e.ex))];
  if(pain.length) notes.push(['warn','Douleur signalée récemment : '+pain.slice(0,3).join(', ')+'. Allège la charge sur ces exercices.']);
  const nn=notes.filter(Boolean);
  return `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><h3 style="margin:0 0 8px">Lecture de tes perfs</h3>
    ${rows.map(r=>`<div class="kv"><span>${r[0]}</span><span>${esc(r[1])}</span></div>`).join('')}
    ${nn.map(x=>`<p class="small ${x[0]}" style="margin-top:8px">${esc(x[1])}</p>`).join('')}</div>`;
}

const DAYRE=/^(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|lun|mar|mer|jeu|ven|sam|dim)\b\.?\s*(?:[:\-–—]\s*)?(.*)$/;
const DAYIDX={lundi:0,lun:0,mardi:1,mar:1,mercredi:2,mer:2,jeudi:3,jeu:3,vendredi:4,ven:4,samedi:5,sam:5,dimanche:6,dim:6};
const RXRE=/(\d{1,2})\s*(?:x|×|\*|s[ée]ries?\s*(?:de|x|×)?)\s*(\d{1,3}(?:\s*[-–]\s*\d{1,3})?)(\s*(?:min|sec|s|km|m)\b)?/i;
function parseExercise(line){
  let name=line,r='',unit='';
  const m=line.match(RXRE);
  if(m){
    const before=line.slice(0,m.index).replace(/[:\-–—,\s]+$/,'').trim(),after=line.slice(m.index+m[0].length).replace(/^[\s,;:\-–—]+/,'').trim();
    unit=(m[3]||'').trim();
    r=m[1]+' × '+m[2].replace(/\s/g,'')+(unit?' '+unit:'');
    name=before||after;
    if(before&&after) r+=' · '+after;
  } else {
    const d=line.match(/(\d+(?:[.,]\d+)?)\s*(min|km|h)\b/i);
    if(d){name=line.slice(0,d.index).replace(/[:\-–—,\s]+$/,'').trim()||line;r=d[0]}
  }
  return {n:name.slice(0,40),r:r.slice(0,24),timed:/^(s|sec)$/i.test(unit)};
}
const GENRE=/^(?:seance|jour|day|workout|entrainement)\s*([a-z0-9]{1,2})?\b\s*(?:[:\-–—]\s*)?(.*)$/;
function parseProgram(text){
  const blocks=[],byDay={};let cur=null,items=0;
  const lines=String(text||'').split(/\r?\n/).slice(0,250);
  for(const raw of lines){
    const line=raw.trim().replace(/^([-–—•●▪◦*]+|\d+[.)])\s+/,'');
    if(!line) continue;
    const nl=norm(line),hm=nl.match(DAYRE);
    if(hm){
      const di=DAYIDX[hm[1]];
      let title=line.slice(line.length-hm[2].length).trim();
      if(/repos/.test(norm(title))){byDay[di]=null;cur=null;continue}
      let b=byDay[di];if(!b){b={day:di,t:'',items:[]};byDay[di]=b;blocks.push(b)}
      cur=b;
      if(title&&RXRE.test(title)){if(addItem(b,title)) items++;title=''}
      if(title&&!b.t) b.t=title.slice(0,30);
      continue;
    }
    const gm=nl.match(GENRE),colon=/^[^:]{2,30}:$/.test(line)&&!RXRE.test(line);
    if(gm||colon){
      const title=gm?(gm[2]?line.slice(line.length-gm[2].length).trim():line.replace(/[:\-–—\s]+$/,'')):line.slice(0,-1).trim();
      cur={day:null,t:title.slice(0,30),items:[]};blocks.push(cur);continue;
    }
    if(!cur) continue;
    if(addItem(cur,line)) items++;
  }
  const sess=blocks.filter(b=>b.items.length),fixed=sess.filter(b=>b.day!=null),gen=sess.filter(b=>b.day==null);
  const used=new Set(fixed.map(b=>b.day)),restSet=new Set(Object.keys(byDay).filter(k=>byDay[k]===null).map(Number));
  const P=(DAYPOS[sess.length]||[0,1,2,3,4,5,6]).slice(),order=[...P,0,1,2,3,4,5,6].filter((d,i,a)=>a.indexOf(d)===i&&!used.has(d)&&!restSet.has(d));
  let dropped=0;
  gen.forEach(b=>{const d=order.shift();if(d==null){dropped++;return}b.day=d;used.add(d)});
  const out={};let n=0,ex=0;
  sess.forEach(b=>{if(b.day!=null){out[b.day]={t:b.t,items:b.items};n++;ex+=b.items.length}});
  if(!n) return {err:'Je n’ai trouvé aucune séance. Écris le nom du jour (Lundi, Mardi…) ou « Séance A », puis un exercice par ligne, par exemple « Squat 4x8 ».'};
  return {days:out,n,ex,rest:[...restSet],auto:gen.length>0,dropped};
}
function addItem(d,line){
  if(d.items.length>=14) return false;
  const e=parseExercise(line);if(e.n.length<2) return false;
  const nn=norm(e.n),cardio=/course|footing|jogging|running|velo|marche|natation|rameur|cardio|hiit|fractionn|sortie|echauffement|etirement|mobilit|retour au calme/.test(nn),core=/planche|gainage|abdo|crunch|releves|mountain/.test(nn);
  const it={n:e.n};if(e.r) it.r=e.r;
  if(core){it.k='core';if(e.timed) it.t=true}
  else if(!cardio) it.k=d.items.some(x=>x.k==='main')?'acc':'main';
  d.items.push(it);return true;
}
function customFromProgram(res){

}

function monthMap(){
  const m=Object.assign({},S.mhist||{}),c={};
  for(const [k,d] of Object.entries(S.days)){
    if(!d||!d.claimed) continue;
    let x=0;for(const v of Object.values(d.claimed)) x+=(v&&v.xp)||0;

}

function duelStats(start,oppRow,type){
  type=duelType(type);
  const end=addDays(start,6),t=today(),last=t<end?t:end,ix=DUEL_TYPES[type].i;
  let me=0,op=0;
  for(let i=0;i<=daysBetween(start,last);i++){
    const k=addDays(start,i),a=oppRow&&oppRow.sd&&oppRow.sd[k];
    me+=dayMetric(k,type);op+=a?(ix===2?a[2]/100:a[ix]):0;
  }
  me=Math.round(me*100)/100;op=Math.round(op*100)/100;
  const over=t>end,fresh=!!oppRow&&(oppRow.t>=parseKey(addDays(end,1)).getTime()||t>addDays(end,3));
  const state=!over?'ongoing':!oppRow?'gone':!fresh?'wait':me>op?'win':me<op?'lose':'draw';
  return {me,op,end,over,type,state,left:Math.max(0,daysBetween(t,end)+1)};
}

  const w=toNum(v.weight),h=toNum(v.height);
  if(v.goal==='lose'||v.goal==='muscle'){
    const t=toNum(v.target);
    if(!Number.isFinite(t)) return 'Indique ton poids cible.';
    if(v.goal==='lose'){
      if(t>=w) return 'Pour perdre du poids, le poids cible doit être inférieur à ton poids actuel ('+fmt(w,1)+' kg).';
      if(bmi(t,h)<18.5) return 'Ce poids cible donne un IMC sous 18,5. Choisis au moins '+fmt(18.5*Math.pow(h/100,2),1)+' kg.';
    } else {
      if(t<=w) return 'Pour prendre du muscle, le poids cible doit être supérieur à ton poids actuel ('+fmt(w,1)+' kg).';
      if(t>w+25) return 'Vise une étape plus raisonnable : au plus 25 kg de plus que ton poids actuel.';
    }

function countdown(){
  const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),s=Math.max(0,Math.floor((m-n)/1000));

      const c=ensureCustom(src);if(!c||c.slot==='rest') break;
      const o={slot:c.slot,items:(c.items||[]).map(x=>Object.assign({},x))};if(c.t) o.t=c.t;
      S.custom[to]=o;save();render();toast('Séance copiée vers '+DAYS[to].toLowerCase()+'.');break}
    case 'prog-auto': S.custom={};ui.editDay=null;save();render();toast('Programme automatique rétabli.');break;
    case 'cycle-reset': S.progStart=weekStart(today());save();render();toast('Cycle relancé à la semaine 1.');break;
    case 'ed-open': ui.editDay=parseInt(D.d,10);if(S.progMode==='own'&&curSlot(ui.editDay)==='rest'){S.custom[ui.editDay]={slot:'own',items:[]};save()}ui.open[D.d]=true;render();break;
    case 'ed-close': ui.editDay=null;render();break;
    case 'ed-reset': if(ui.editDay!=null){delete S.custom[ui.editDay];ui.editDay=null;save();render()}break;
    case 'ed-up': case 'ed-down':{
      if(ui.editDay==null) break;const c=ensureCustom(ui.editDay);if(!c.items) break;
      const i=parseInt(D.i,10),j=a==='ed-up'?i-1:i+1;if(j<0||j>=c.items.length) break;
      const tmp=c.items[i];c.items[i]=c.items[j];c.items[j]=tmp;save();render();break}
    case 'ed-del':{if(ui.editDay==null) break;const c=ensureCustom(ui.editDay);if(!c.items) break;c.items.splice(parseInt(D.i,10),1);save();render();break}
    case 'ed-add':{
      if(ui.editDay==null) break;
      const nm=(($('#ed-new')||{}).value||'').trim().slice(0,40),rx=(($('#ed-new-rx')||{}).value||'').trim().slice(0,24);
      if(!nm){toast('Indique un nom d’exercice.');break}
      const c=ensureCustom(ui.editDay);if(!c.items) break;
      if(c.items.length>=14){toast('14 exercices maximum par séance.');break}
      c.items.push(rx?{n:nm,k:'acc',r:rx}:{n:nm,k:'acc'});save();render();break}
    case 'edit-profile': ui.wz=newWizard('edit'); render(); window.scrollTo(0,0); break;
    case 'reset':
      $('#resetzone').innerHTML='<p class="small bad" style="margin-bottom:8px">Toute ta progression sera effacée. Cette action est définitive.</p><div class="row"><button class="btn bad sm" data-a="reset-yes">Oui, tout effacer</button><button class="btn sm" data-a="reset-no">Annuler</button></div>';break;
    case 'reset-no': render(); break;
    case 'reset-yes':
      S=null;memStore=null;try{localStorage.removeItem(KEY)}catch(err){}
      if(cloud.db&&cloud.uid){try{cloud.db.doc('data/users/'+cloud.uid+'/save').delete().catch(()=>{});if(!cloud.readOnly)cloud.db.doc('players/'+cloud.uid).delete().catch(()=>{})}catch(err){}}
      ui.tab='status';ui.wz=newWizard('new');render();window.scrollTo(0,0);break;
    case 'wz-gear':{const g=gearList(ui.wz.v.gear),i=g.indexOf(D.g);if(i>=0) g.splice(i,1); else g.push(D.g);ui.wz.v.gear=gearList(g).join(',');render();break}
    case 'wz-set': ui.wz.v[D.k]=D.v; ui.wz.err=''; render(); break;
    case 'wz-next':{const e2=validateStep(ui.wz.step);if(e2){ui.wz.err=e2;render();break}ui.wz.err='';ui.wz.step++;render();window.scrollTo(0,0);break}
    case 'wz-back': ui.wz.err='';ui.wz.step=Math.max(1,ui.wz.step-1);render();window.scrollTo(0,0);break;
    case 'wz-cancel': ui.wz=null;render();break;
    case 'wz-finish':{
      for(const s of [1,2,3]){const e2=validateStep(s);if(e2){ui.wz.err=e2;ui.wz.step=s;render();return}}
      finishWizard();break}
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='imp_text') ui.impText=el.value.slice(0,4000);
  if(S&&/^r_(km|h|m|s)$/.test(el.id)) runPrev('r');
  if(S&&/^re_(km|h|m|s)$/.test(el.id)) runPrev('re');
  if(el.dataset&&el.dataset.w&&ui.wz) ui.wz.v[el.dataset.w]=el.value;
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(S&&el.id==='p_ex'){
    const v=el.value.trim(),{es}=exEntries(v),l=es[es.length-1],h=$('#p-hint');
    if(l){const k=$('#p_kg'),r=$('#p_reps');if(k) k.value=l.kg>0?l.kg:'';if(r) r.value=l.reps}
    if(h) h.innerHTML=perfHint(v);
    return;
  }
  const c=el.dataset&&el.dataset.c; if(!c||!S) return;
  const n=toNum(el.value);
  if(c==='steps') setField('steps',Math.round(n),100000,'Pas');
  else if(c==='remind'){S.remind=el.value==='off'?{on:false,dow:remindCfg().dow}:{on:true,dow:parseInt(el.value,10)};save();render()}
  else if(c==='stretch') setField('stretch',Math.round(n),180,'Minutes');
  else if(c==='work') setField('work',Math.round(n),600,'Minutes');
  else if(c==='ed-title'){
    const d=parseInt(el.dataset.d,10);if(!(d>=0&&d<=6)) return;
    const cu=ensureCustom(d);if(cu.slot!=='own') return;
    const v=String(el.value).trim().slice(0,30);if(v) cu.t=v; else delete cu.t;
    save();render();
  }
  else if(c==='ed-type'){
    const d=parseInt(el.dataset.d,10);if(!(d>=0&&d<=6)||!SLOTS.some(q=>q[0]===el.value)) return;
    if(el.value===(baseSlots()[d]||'rest')) delete S.custom[d]; else S.custom[d]={slot:el.value};
    save();render();
  }
  else if(c==='ed-name'||c==='ed-rx'){
    const d=ui.editDay;if(d==null) return;
    const cu=ensureCustom(d),it=cu.items&&cu.items[parseInt(el.dataset.i,10)];if(!it) return;
    if(c==='ed-name'){const v=String(el.value).trim().slice(0,40);if(!v){render();return}it.n=v}
    else{const v=String(el.value).trim().slice(0,24);if(v) it.r=v; else delete it.r}
    save();render();
  }
});
document.addEventListener('toggle',e=>{const el=e.target;if(el&&el.dataset&&el.dataset.day!=null&&ui.editDay==null) ui.open[el.dataset.day]=!!el.open},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#layer .modal')) closeModal()});

/* ---------- compte et classement partagé ---------- */
async function initCloud(){
  try{
    const c=window.claude; if(!c||!c.use) return;
    const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    cloud.db=db;cloud.uid=uid;cloud.status='sync';
    try{
      const snap=await db.doc('data/users/'+uid+'/save').get();
      if(snap.exists){
        const r=snap.data()||{};
        if(typeof r.json==='string'&&(!S||(r.t||0)>S.t)){
          const rs=migrate(JSON.parse(r.json));
          if(rs){S=rs;lsSet(JSON.stringify(S));ui.wz=null;reconcile();toast('Progression restaurée depuis ton compte.')}
        } else if(S&&S.t>(r.t||0)) schedulePush();
      } else if(S) schedulePush();
    }catch(e){}
    try{
      db.collection('players').limit(200).onSnapshot(snap=>{
        cloud.players=snap.docs.map(d=>sanitizeRow(d.id,d.data()));
        if(S&&!ui.wz&&ui.tab==='rank') render();
      },()=>{cloud.status='local'});
    }catch(e){}
    if(S) syncPlayer();
    render();
  }catch(e){cloud.status='local'}
}
function schedulePush(){
  if(!cloud.db||!cloud.uid) return;
  clearTimeout(cloud.sTimer);cloud.sTimer=setTimeout(pushNow,2500);
}
async function pushNow(){
  if(!cloud.db||!S) return;
  if(cloud.saving){cloud.pending=true;return}
  cloud.saving=true;
  try{await cloud.db.doc('data/users/'+cloud.uid+'/save').set({t:S.t,json:JSON.stringify(S)})}catch(e){}
  cloud.saving=false;
  if(cloud.pending){cloud.pending=false;schedulePush()}
}
function syncPlayer(){
  if(!cloud.db||!cloud.uid||!S||cloud.readOnly) return;
  clearTimeout(cloud.pTimer);
  cloud.pTimer=setTimeout(async()=>{
    if(cloud.pDirty) return;
    cloud.pDirty=true;
    try{await cloud.db.doc('players/'+cloud.uid).set(playerDoc())}
    catch(e){if(e&&e.code==='invalid_argument'){cloud.readOnly=true;if(ui.tab==='rank'&&S&&!ui.wz)render()}}
    cloud.pDirty=false;
  },1200);
}

/* ---------- horloge ---------- */
let ticks=0;
function tick(force){
  ticks++;
  const cd=$('#cd');if(cd) cd.textContent=countdown();
  if(force||ticks%30===0){
    if(!S||ui.wz) return;
    if(ui.day!==today()){render();return}
  }
}
function boot(){
  const raw=lsGet();
  if(raw){try{S=migrate(JSON.parse(raw))}catch(e){S=null}}
  if(S) reconcile();
  ui.day=today();
  render();
  initCloud();
  setInterval(tick,1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick(true)});
}
boot();
})();
</script>
